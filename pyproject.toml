[project]
name = "positive-tool"
version = "0.9.0"
description = "一個面向開發者的工具"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["rich==14.3.1"]

[project.urls]
Homepage = "https://github.com/TW0hank0/positive_tool"
Repository = "https://github.com/TW0hank0/positive_tool"

[project.optional-dependencies]
build = ["twine"]
check = ["mypy>=1.19.1", "ruff>=0.14.14", "ty>=0.0.14"]
test = ["pytest>=9.0.2", "pytest-cov==7.1.0"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-v --cov=positive_tool --cov-report=term-missing"
log_cli_level = "INFO"
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.setuptools.package-data]
positive_tool = ["py.typed"]
